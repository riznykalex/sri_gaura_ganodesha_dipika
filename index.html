      <button onclick="setLang('eng')" class="lang-btn">Eng</button>

<div id="content"></div>

<div class="pagination">
  <button onclick="prev()">← Prev</button>
  <span id="pageInfo"></span>
  <button onclick="next()">Next →</button>
</div>

<script>
let data;
let lang = "eng";
let page = 1;
const perPage = 5;
let searchTerm = "";
let filteredData;

const titles = {
  eng: "Sri Gaura Ganodesa Dipika",
  rus: "Шри Гаура Ганодеша Дипика",
  ukr: "Шрі Ґаура Ґанодеша Діпіка"
};

fetch("https://raw.githubusercontent.com/riznykalex/sri_gaura_ganodesha_dipika/refs/heads/main/Sri_Gaura_Ganodesa_Dipika.json")
  .then(r => r.json())
  .then(j => {
    data = j.items;
    filteredData = data;
    setLang(lang); // Set initial active
    render();
  });

document.getElementById("searchInput").oninput = e => {
  searchTerm = e.target.value;
  page = 1; // Reset to first page
  render();
};

function setLang(newLang) {
  lang = newLang;
  // Update active button
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick*="setLang('${newLang}')"]`).classList.add('active');
  render();
};

function render() {
  if (!data) return; // Wait for data to load

  document.getElementById("titleText").textContent = titles[lang];

  const root = document.getElementById("content");
  root.innerHTML = "";

  // Filter data based on search term
  filteredData = data;
  if (searchTerm) {
    filteredData = data.filter(item => {
      const textMatch = item.text[lang] && item.text[lang].toLowerCase().includes(searchTerm.toLowerCase());
      const refMatch = item.ref && item.ref[lang] && item.ref[lang].toLowerCase().includes(searchTerm.toLowerCase());
      return textMatch || refMatch;
    });
  }

  const start = (page - 1) * perPage;
  const slice = filteredData.slice(start, start + perPage);

  slice.forEach(item => {
    const itemDiv = document.createElement("div");
    itemDiv.className = "item";

    let text = item.text[lang] || "";
    let refText = item.ref?.[lang] || "";
    
    if (searchTerm) {
      const regex = new RegExp(searchTerm, 'gi');
      text = text.replace(regex, '<mark>$&</mark>');
      refText = refText.replace(regex, '<mark>$&</mark>');
    }
    
    itemDiv.innerHTML = text;

    const refDiv = document.createElement("div");
    refDiv.className = "ref";
    refDiv.innerHTML = refText;

    itemDiv.appendChild(refDiv);
    root.appendChild(itemDiv);
  });

  document.getElementById("pageInfo").textContent =
    `Page ${page} / ${Math.ceil(filteredData.length / perPage)}`;
}

function next() {
  if (!filteredData || page * perPage >= filteredData.length) return;
  page++;
  render();
}

function prev() {
  if (!filteredData || page <= 1) return;
  page--;
  render();
}
</script>
